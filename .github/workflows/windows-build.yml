name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows 10/11 x64
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Test actual Electron desktop interactions
        run: npm run test:desktop
      - name: Build unpacked Windows application
        run: npx --no-install electron-builder --win --x64 --dir --publish never
      - name: Upload runnable Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Capture-Program-Windows-x64
          path: dist/win-unpacked/
          if-no-files-found: error
          retention-days: 14
