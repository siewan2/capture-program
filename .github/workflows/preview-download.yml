name: Build verified Windows installer
on:
  push:
    branches: [codex/save-border-preview-20261028]
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Build Windows installer
        run: npm run dist:installer -- --publish never
      - name: Verify installation, startup shortcut, app and uninstallation
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Capture-Program-Setup-0.19.2-Windows-x64
          path: dist/Capture-Program-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
