name: Build downloadable Windows preview
on:
  push:
    branches: [codex/save-border-preview-20261028]
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Test undo, gallery scroll and native clipboard paste
        run: node scripts/gallery-smoke.cjs
      - run: npx --no-install electron-builder --win zip --x64 --publish never
      - name: Verify portable package
        shell: pwsh
        run: ./scripts/test-portable.ps1
      - name: Upload app files directly for a single ZIP extraction
        uses: actions/upload-artifact@v4
        with:
          name: Capture-Program-gallery-update-Windows-x64
          path: dist/win-unpacked/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
