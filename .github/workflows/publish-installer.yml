name: Publish verified Windows installer
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows build run ID
        required: true
      version:
        description: Installer version
        required: true
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify source build
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_RUN_ID: ${{ inputs.run_id }}
          CAPTURE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$CAPTURE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$CAPTURE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAPTURE_RUN_ID" > "$RUNNER_TEMP/capture-source-run.json"
          jq -e '.status == "completed" and .conclusion == "success" and .head_branch == "main" and .path == ".github/workflows/windows-build.yml"' "$RUNNER_TEMP/capture-source-run.json"
          echo "CAPTURE_SOURCE_SHA=$(jq -r .head_sha "$RUNNER_TEMP/capture-source-run.json")" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: Capture-Program-Windows-Installer-x64
          path: installer
      - name: Publish installation EXE
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_VERSION: ${{ inputs.version }}
        run: |
          installer="installer/Capture-Program-Setup-$CAPTURE_VERSION.exe"
          test -f "$installer"
          gh release create "v$CAPTURE_VERSION" "$installer" --target "$CAPTURE_SOURCE_SHA" --title "Capture Program v$CAPTURE_VERSION" --notes-file build/release-notes.md
