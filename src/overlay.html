<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'"><title>캡처 영역 선택</title><link rel="stylesheet" href="overlay.css"></head><body><canvas id="surface"></canvas><div id="magnifier" hidden><canvas id="zoom" width="160" height="160"></canvas><small id="zoomLabel"></small></div><div id="hint" role="status">마우스로 영역을 드래그하세요 · Esc 취소</div><div id="fixedControls" hidden><label>프리셋 <select id="capturePresets" aria-label="캡처 크기 프리셋"></select></label><label>가로 <input id="captureWidth" type="number" min="1" max="16384" aria-label="캡처 가로 픽셀"></label><label>세로 <input id="captureHeight" type="number" min="1" max="16384" aria-label="캡처 세로 픽셀"></label><button id="applyCaptureSize">크기 적용</button><button id="addCapturePreset">프리셋 추가</button><button id="fixedCapture">캡처 · Enter</button><button id="fixedCancel">취소 · Esc</button><span>방향키: 1px 이동 · Shift: 비율 고정 · Alt: 중심 기준 크기 조절</span><small id="fixedStatus" role="status"></small></div><script src="geometry.js"></script><script src="overlay.js"></script></body></html>
